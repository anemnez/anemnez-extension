[package]
name = "anemnez-extension-serve"
description = "The serving face of the Anemnez extension contract: Events, Health and Describe over gRPC, async on an injected clock"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# A crate of its own, never a feature of anemnez-extension (B, 2026-11-07): Cargo unifies features,
# so a `serve` feature one consumer turned on would put tokio and the clock into every other
# consumer's kernel build. The kernel stays pure; this is the async layer above it.

[dependencies]
anemnez-extension.workspace = true
anemnez-clock.workspace = true
anemnez-layout.workspace = true
base64.workspace = true
tonic.workspace = true
prost.workspace = true
prost-types.workspace = true
tokio.workspace = true
futures-util.workspace = true
# A carried connection closed at accept is said in the product's own log (crate::carried).
tracing.workspace = true
sha2.workspace = true
http.workspace = true
http-body.workspace = true
http-body-util.workspace = true
bytes.workspace = true
tower-layer.workspace = true
tower-service.workspace = true
# The log face (CONTRACT.md `#a-products-events-are-read-through-one-call`): a product's own hydramq-events log,
# served through `wire`. The core kernel crate still depends on nothing of hydramq.
hydramq-events.workspace = true

[build-dependencies]
# The contract's protos come from the kernel crate itself (`protos::write_all`): the version this
# crate depends on IS the contract it serves, with no copy here.
anemnez-extension.workspace = true
tonic-build.workspace = true

[dev-dependencies]
anemnez-sim.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net"] }
tempfile.workspace = true
tokio-stream.workspace = true
hyper-util.workspace = true
tower.workspace = true

# The simulation's seeded runtime is read by `cfg!(tokio_unstable)` (standards cargo/sim-tokio-unstable).
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(tokio_unstable)"] }
