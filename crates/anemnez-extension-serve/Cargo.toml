[package]
name = "anemnez-extension-serve"
description = "The serving face of the Anemnez extension contract: Events, Health and Describe over gRPC, async on an injected clock"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# A crate of its own, never a feature of anemnez-extension (B, 2026-11-07): Cargo unifies features,
# so a `serve` feature one consumer turned on would put tokio and the clock into every other
# consumer's kernel build. The kernel stays pure; this is the async layer above it.

[dependencies]
anemnez-extension.workspace = true
anemnez-clock.workspace = true
tonic.workspace = true
prost.workspace = true
prost-types.workspace = true
tokio.workspace = true
futures-util.workspace = true
sha2.workspace = true
http.workspace = true
http-body-util.workspace = true
bytes.workspace = true
tower-layer.workspace = true
tower-service.workspace = true
libc.workspace = true

[build-dependencies]
# The contract's protos come from the kernel crate itself (`protos::write_all`): the version this
# crate depends on IS the contract it serves, with no copy here.
anemnez-extension.workspace = true
tonic-build.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "net"] }
tempfile.workspace = true
tokio-stream.workspace = true
hyper-util.workspace = true
tower.workspace = true
