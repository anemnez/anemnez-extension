[package]
name = "anemnez-extension-client"
description = "Calling an Anemnez extension from its own descriptor: JSON arguments to the exact request bytes and back, and the call over a raw-bytes codec, one way for every bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anemnez-extension.workspace = true
anemnez-clock.workspace = true
hydramq-events.workspace = true
prost.workspace = true
prost-reflect.workspace = true
serde_json.workspace = true
tonic.workspace = true
bytes.workspace = true
http.workspace = true

[dev-dependencies]
anemnez-extension = { workspace = true }
anemnez-extension-fixture = { path = "../anemnez-extension-fixture", version = "0.7.0", registry = "artichoke" }
anemnez-clock.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net"] }
tempfile.workspace = true
# The events round trip's producer: a contract Events service whose Call is the face's serve.
anemnez-extension-serve = { path = "../anemnez-extension-serve", version = "0.7.0", registry = "artichoke" }
tokio-stream.workspace = true
hyper-util.workspace = true
tower.workspace = true
