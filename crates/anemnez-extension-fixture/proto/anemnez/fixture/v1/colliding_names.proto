// Fixture variant 'colliding_names': a descriptor a bridge must refuse at connect.
syntax = "proto3";

package anemnez.fixture.collidingnames.v1;

import "anemnez/extension/v1/options.proto";

service Fixture {
  option (anemnez.extension.v1.anemnez_service) = { contract: "fixture" version: "1.0.0" cursor_scope: INSTANCE events_kept: 64 };
  rpc GetURL(Req) returns (One) { option (anemnez.extension.v1.anemnez_method) = { description: "The URL." result: { one: {} } effect: READ presence: FULL permission: ALLOW callers: AGENT }; }
  rpc GetUrl(Req) returns (One) { option (anemnez.extension.v1.anemnez_method) = { description: "The URL again." result: { one: {} } effect: READ presence: FULL permission: ALLOW callers: AGENT }; }
}

message Req {}
message One {
  string id = 1;
}
message Many {
  repeated string ids = 1;
}
