// Fixture variant 'person_act_allow': a descriptor a bridge must refuse at connect.
syntax = "proto3";

package anemnez.fixture.personactallow.v1;

import "anemnez/extension/v1/options.proto";

service Fixture {
  option (anemnez.extension.v1.anemnez_service) = { contract: "fixture" version: "1.0.0" cursor_scope: INSTANCE events_kept: 64 };
  rpc Approve(Req) returns (One) { option (anemnez.extension.v1.anemnez_method) = { description: "A person's approval, wrongly allowed." result: { one: {} } effect: WRITE presence: FULL permission: ALLOW callers: AGENT person_act: true }; }
}

message Req {}
message One {
  string id = 1;
}
message Many {
  repeated string ids = 1;
}
