// An extension's events: one stream, one cursor space, resumable, filtered by kind
// (docs/specs/CONTRACT.md, #a-product-pushes-events-as-a-stream-it-serves).
syntax = "proto3";

package anemnez.extension.v1;

service Events {
  // Ends with a retryable `expired` at the caller's principal token's expiry, and refuses an
  // instance-scoped cursor issued elsewhere with `cursor-not-mine`.
  rpc Events(EventsRequest) returns (stream Event);
  // The product's event log, through the one face (docs/specs/CONTRACT.md,
  // #a-products-events-are-read-through-one-call): `request` and `reply` are hydramq-events'
  // `wire` messages, carried opaquely. Nothing in the contract parses them. A product whose events
  // are not on that log yet refuses it with `events-call-unserved`.
  rpc Call(CallRequest) returns (CallReply);
  // The same log, pushed (#a-products-events-are-pushed-through-one-watch): `request` is one
  // `hydramq_events::wire` watch request, and each frame one of the producer's `wire::watch`
  // frames (events, a heartbeat, or the end), carried opaquely. Refused `events-call-unserved`
  // like Call by a product whose events are not on that log yet.
  rpc Watch(WatchRequest) returns (stream WatchFrame);
}

message WatchRequest {
  // One `hydramq_events::wire::watch_request`.
  bytes request = 1;
}

message WatchFrame {
  // One frame of the producer's `hydramq_events::wire::watch`.
  bytes frame = 1;
}

message CallRequest {
  // One `hydramq_events::wire` request (read, or latest).
  bytes request = 1;
}

message CallReply {
  // The producer's `hydramq_events::wire::serve` answer, a refusal included.
  bytes reply = 1;
}

message EventsRequest {
  // The last cursor the caller saw; empty for the head.
  string after = 1;
  // The kinds wanted; empty for every kind.
  repeated string kinds = 2;
}

message Event {
  string cursor = 1;
  // A kind the extension declares in its proto ("health" is one).
  string kind = 2;
  // The event, encoded as the declared kind's message. Never a secret's value.
  bytes payload = 3;
}
