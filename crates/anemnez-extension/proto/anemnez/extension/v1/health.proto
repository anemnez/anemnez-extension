// An extension's health: state, with parts, and the cursor it is true as of
// (docs/specs/CONTRACT.md, #health-is-state-with-parts). A watcher reads Get, then subscribes
// Events(after: as_of, kinds: ["health"]).
syntax = "proto3";

package anemnez.extension.v1;

service Health {
  rpc Get(HealthRequest) returns (HealthReply);
}

message HealthRequest {}

message HealthReply {
  State state = 1;
  repeated Part parts = 2;
  // The events cursor this answer is true as of.
  string as_of = 3;
  string detail = 4;
  // What restarting this instance would cost now, in its own words (D, 2026-11-10: Herald's announce
  // names it for every train that would reload it). Absent: say the product's name only; nobody guesses.
  RestartCost restart_cost = 5;
}

// What a restart costs: live state (which models are warm, how many sessions are attached), so it is
// Health's, not the static descriptor's.
message RestartCost {
  // One sentence a person reads: "qwen-35b-mlx warm (35B, about 40 s to reload) and the embedder".
  string line = 1;
  // The product's own measured estimate of seconds back to serving; unset when it has not measured.
  optional uint32 secs = 2;
}

message Part {
  // A path: "memory/index".
  string name = 1;
  State state = 2;
  string detail = 3;
  // Unix milliseconds.
  int64 since = 4;
}

// SERVING and DEGRADED are both serving.
enum State {
  UNKNOWN = 0;
  STARTING = 1;
  SERVING = 2;
  DEGRADED = 3;
  FAILING = 4;
  DRAINING = 5;
  DRAINED = 6;
}
