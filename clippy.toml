# Function-size gate: clippy::too_many_lines fires past this (proofs/quality — the census
# ratchets the count, so oversized functions are standing debt, never silent growth).
#
# Rendering preserves an existing clippy.toml, and that is safe here: clippy's own default for
# too-many-lines-threshold is also 100, so the census works identically whether this file landed
# or the project's own config won.
too-many-lines-threshold = 100

# The clock standard (prova-project-standards `cargo/clock-bans`): time is read and waited on through
# an injected anemnez-clock `Clock`, never off the system directly, so a test advances a ManualClock
# instead of waiting a timer out. The kernel reads no time at all (`signed::fresh` takes `now_ms`);
# the serving face reads only the Clock it is given. Clippy runs at -D warnings, so any hit is red.
disallowed-methods = [
  # clock bans (project-standards): begin
  { path = "std::time::Instant::now", reason = "clock: through an injected anemnez-clock Clock" },
  { path = "std::time::SystemTime::now", reason = "clock: through an injected anemnez-clock Clock" },
  { path = "std::thread::sleep", reason = "clock: through an injected anemnez-clock Clock" },
  { path = "tokio::time::sleep", reason = "clock: through an injected anemnez-clock Clock" },
  { path = "tokio::time::sleep_until", reason = "clock: through an injected anemnez-clock Clock" },
  { path = "tokio::time::interval", reason = "clock: through an injected anemnez-clock Clock" },
  { path = "tokio::time::interval_at", reason = "clock: through an injected anemnez-clock Clock" },
  { path = "tokio::time::timeout", reason = "clock: through an injected anemnez-clock Clock" },
  { path = "tokio::time::timeout_at", reason = "clock: through an injected anemnez-clock Clock" },
  { path = "tokio::time::Instant::now", reason = "clock: through an injected anemnez-clock Clock" },
  { path = "chrono::Utc::now", reason = "clock: through an injected anemnez-clock Clock" },
  { path = "chrono::Local::now", reason = "clock: through an injected anemnez-clock Clock" },
  { path = "std::time::SystemTime::elapsed", reason = "clock: through an injected anemnez-clock Clock" },
  { path = "std::time::Instant::elapsed", reason = "clock: through an injected anemnez-clock Clock" },
  { path = "tokio::time::Instant::elapsed", reason = "clock: through an injected anemnez-clock Clock" },
  { path = "libc::clock_gettime", reason = "clock: through an injected anemnez-clock Clock" },
  { path = "libc::gettimeofday", reason = "clock: through an injected anemnez-clock Clock" },
  { path = "libc::time", reason = "clock: through an injected anemnez-clock Clock" },
  { path = "libc::mach_absolute_time", reason = "clock: through an injected anemnez-clock Clock" },
  { path = "libc::nanosleep", reason = "clock: through an injected anemnez-clock Clock" },
  { path = "libc::usleep", reason = "clock: through an injected anemnez-clock Clock" },
  # clock bans (project-standards): end
]
