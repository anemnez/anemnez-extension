[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2024"
repository = "https://github.com/anemnez/anemnez-extension"
license = "MIT OR Apache-2.0"
version = "0.1.1"
# Released to Artichoke only for now (the User, 2026-11-05); crates.io comes when third-party
# extensibility is advertised, and then Herald publishes each version to both, same bytes
# (fabric CONVERGENCE.md §0 (7)).
publish = ["artichoke"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
ed25519-dalek = "2"
serde_json = "1"

# The serving face (crates/anemnez-extension-serve): the gRPC stack matches Substrate's and
# anemnez-service's (tonic 0.12 / prost 0.13), so a product pulls in no second copy.
anemnez-extension = { path = "crates/anemnez-extension", version = "0.1.1", registry = "artichoke" }
anemnez-clock = { version = "0.1.4", registry = "artichoke" }
tonic = "0.12"
tonic-build = "0.12"
prost = "0.13"
prost-types = "0.13"
tokio = { version = "1", features = ["sync", "macros"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
sha2 = "0.10"
tempfile = "3"
tokio-stream = { version = "0.1", features = ["net"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tower = "0.5"
