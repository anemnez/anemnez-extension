[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2024"
repository = "https://github.com/anemnez/anemnez-extension"
license = "MIT OR Apache-2.0"
version = "0.1.1"
# Released to Artichoke only for now (the User, 2026-11-05); crates.io comes when third-party
# extensibility is advertised, and then Herald publishes each version to both, same bytes
# (fabric CONVERGENCE.md §0 (7)).
publish = ["artichoke"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
ed25519-dalek = "2"
serde_json = "1"
